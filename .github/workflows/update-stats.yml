name: Update Stats and Metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create assets directory
        run: mkdir -p .github/assets/images

      - name: Generate Stats Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: .github/assets/images/stats_en.svg

          # ecrit le fichier sans commit ni push : le step final s'en charge
          output_action: none

          base: header, activity, community, repositories
          config_timezone: Europe/Paris

          plugin_lines: yes

      - name: Generate Languages Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: .github/assets/images/langs.svg

          # ecrit le fichier sans commit ni push : le step final s'en charge
          output_action: none

          base: ""
          config_timezone: Europe/Paris

          plugin_languages: yes
          plugin_languages_limit: 0
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          extras_css: |
            h2, .header, .title {
              display: none !important;
            }

      - name: Validate generated SVGs
        run: |
          ls -lah .github/assets/images

          for f in .github/assets/images/stats_en.svg .github/assets/images/langs.svg; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty"
              exit 1
            fi

            if ! grep -q "</svg>" "$f"; then
              echo "::error::$f is not a valid SVG:"
              head -c 500 "$f"
              exit 1
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .github/assets/images/*.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "[auto] Update profile stats and languages"
          git push
