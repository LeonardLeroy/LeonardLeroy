name: Update Stats and Metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create assets directory
        run: mkdir -p .github/assets/images

      # ------------------------------------------------------------------
      # Une seule version de chaque carte. Les couleurs sont choisies pour
      # rester lisibles sur fond blanc comme sur le fond sombre de GitHub :
      # prefers-color-scheme suit le theme de l'OS, pas celui de GitHub,
      # donc un jeu clair/sombre ne couvrait pas tous les visiteurs.
      # ------------------------------------------------------------------

      - name: Generate Stats Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: .github/assets/images/stats_en.svg

          # ecrit le fichier sans commit ni push : le step final s'en charge
          output_action: none

          base: header, activity, community, repositories
          config_timezone: Europe/Paris

          # organization_member met stars/releases/licence/lignes a zero,
          # on reste donc sur les repos personnels pour ces agregats
          # (les commits et contributions d'org viennent du token, pas d'ici)

          # par defaut seuls 4 repos sont analyses pour les lignes
          plugin_lines_repositories_limit: 0

          # les commits sont signes avec l'adresse epitech, pas celle du compte
          commits_authoring: leonard.leroy@epitech.eu, LeonardLeroy

          plugin_lines: yes

          # palette leonardleroy.me : teal #0f766e, gris #6b6b6b
          extras_css: |
            svg {
              font-family: Inter, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, sans-serif;
            }
            h1, h2 {
              color: #0f766e !important;
              font-size: 12px !important;
              font-weight: 600 !important;
              letter-spacing: 1.6px;
              text-transform: uppercase;
              margin: 16px 0 6px !important;
            }
            /* #0a0a0a est invisible sur le fond sombre de GitHub (1.05) :
               le gris de la palette passe sur les deux fonds (5.33 / 3.55) */
            .field { color: #6b6b6b !important; }
            .field svg { fill: #6b6b6b !important; }
            .added { color: #0f766e !important; }
            .removed { color: #6b6b6b !important; }
            /* metrics peint chaque case en attribut fill=, pas via les
               variables --color-calendar-* : on cible donc la valeur */
            .day[fill="#ebedf0"] { fill: #f0faf8; }
            .day[fill="#9be9a8"] { fill: #99f6e4; }
            .day[fill="#40c463"] { fill: #5eead4; }
            .day[fill="#30a14e"] { fill: #14b8a6; }
            .day[fill="#216e39"] { fill: #0f766e; }

      # ------------------------------------------------------------------
      # Repartition des langages. Les couleurs des langages restent celles
      # de GitHub : ce sont des donnees, pas de la decoration.
      # ------------------------------------------------------------------

      - name: Generate Languages Metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          filename: .github/assets/images/langs.svg

          output_action: none

          base: ""
          config_timezone: Europe/Paris

          plugin_languages: yes
          plugin_languages_limit: 0
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          extras_css: |
            h2, .header, .title {
              display: none !important;
            }
            svg {
              font-family: Inter, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, sans-serif;
            }
            .field { color: #6b6b6b !important; }

      - name: Collect renders
        run: |
          ls -laR /metrics_renders

          cp /metrics_renders/.github/assets/images/*.svg .github/assets/images/

      - name: Validate generated SVGs
        run: |
          ls -lah .github/assets/images

          for name in stats_en langs; do
            f=".github/assets/images/$name.svg"

            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty"
              exit 1
            fi

            if ! grep -q "</svg>" "$f"; then
              echo "::error::$f is not a valid SVG:"
              head -c 500 "$f"
              exit 1
            fi
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .github/assets/images/*.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "[auto] Update profile stats and languages"
          git push
